<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GS25 포카 루트</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00b3d6">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1d21;--sub:#6b7280;--line:#e5e7eb;--gs:#00b3d6;--ok:#16a34a;--no:#dc2626;--warn:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1b1e23;--ink:#eef0f3;--sub:#9aa1ab;--line:#2c3038}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--gs);color:#fff}
header h1{font-size:16px;margin:0;flex:1}
header small{opacity:.9;font-size:12px}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#map{height:38vh;min-height:220px;flex:none}
#panel{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--card)}
@media (min-width:900px){#main{flex-direction:row}#map{height:auto;flex:1}#panel{flex:none;width:430px;border-left:1px solid var(--line)}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px 0;border:0;background:none;color:var(--sub);font-size:15px;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--gs);border-color:var(--gs)}
.view{flex:1;overflow:auto;padding:10px 12px 80px;display:none}
.view.on{display:block}
.row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12px;color:var(--sub)}
.row.has{background:color-mix(in srgb,var(--gs) 10%,transparent)}
.row.zero{opacity:.5}
.qty{width:58px;padding:8px;font-size:17px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.btn.p{background:var(--gs);border-color:var(--gs);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{color:var(--no)}
.btn.sm{padding:6px 9px;font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar input[type=search]{flex:1;min-width:120px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
.next{border:2px solid var(--gs);border-radius:12px;padding:12px;margin-bottom:10px}
.next h2{margin:0 0 4px;font-size:19px}
.next .meta{color:var(--sub);font-size:14px;margin-bottom:10px}
.next .acts{display:flex;gap:6px;flex-wrap:wrap}
.next.arrived{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.stop{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.num{width:26px;height:26px;border-radius:50%;background:var(--gs);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.muted{color:var(--sub);font-size:13px}
h3{font-size:15px;margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.pin{background:#9ca3af;color:#fff;border-radius:14px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;transform:translate(-50%,-100%);display:inline-block}
.pin.has{background:var(--gs)}.pin.zero{background:#d1d5db;color:#6b7280}.pin.done{background:var(--ok)}.pin.miss{background:var(--no)}
.me{transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;display:none}
label.s{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
label.s input[type=number]{width:60px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>GS25 포카 루트</h1>
    <small id="gps">📍 위치 확인 중…</small>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="panel">
      <div class="tabs">
        <button data-v="check" class="on">① 재고 체크</button>
        <button data-v="route">② 경로</button>
        <button data-v="log">③ 기록</button>
      </div>

      <div class="view on" id="v-check">
        <div class="bar">
          <button class="btn p" id="findBtn">지도 중심 주변 GS25 찾기</button>
          <label class="s">반경 <input type="number" id="radius" value="2" min="0.5" max="20" step="0.5">km</label>
        </div>
        <div class="bar">
          <input type="search" id="q" placeholder="매장 이름 검색 (예: 관양)">
          <button class="btn sm" id="resetToday">오늘 재고 초기화</button>
        </div>
        <div class="muted" style="margin-bottom:6px">GS 앱에 나온 개수를 입력하세요. 비우면 미확인, 0이면 없음이에요. 재고가 있는 매장만 경로에 들어가요.</div>
        <div id="storeList"></div>
      </div>

      <div class="view" id="v-route">
        <div id="nextCard"></div>
        <div class="bar">
          <button class="btn" id="kakaoAll">카카오맵 전체경로</button>
          <label class="s">전기자전거 <input type="number" id="speed" value="20" min="8" max="30">km/h</label>
        </div>
        <div id="stops"></div>
        <div class="muted" style="margin-top:8px">GPS 위치가 바뀌거나 체크할 때마다 방문 순서를 다시 계산해요. 거리는 직선거리에 도로 보정(×1.35)을 곱한 추정치예요.</div>
      </div>

      <div class="view" id="v-log">
        <h3>매장별 패턴</h3>
        <div id="stats"></div>
        <h3>구매 기록</h3>
        <div id="buys"></div>
        <h3>백업 / 다른 기기로 옮기기</h3>
        <div class="bar">
          <button class="btn" id="exportBtn">기록 복사</button>
          <button class="btn" id="importBtn">기록 붙여넣기</button>
        </div>
        <div class="muted">폰에서 "기록 복사"한 뒤 PC에서 "기록 붙여넣기"하면 기록이 합쳐져요.</div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=tijknjlz53"></script>
<!-- 카카오는 GS25 매장 검색에만 사용 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5a47e29f45a5a1650dff8c887084e342&libraries=services&autoload=false"></script>
<script>
const KEY = 'gs25route.v1';
const ROAD = 1.35;          // 직선→도로 보정
const ARRIVE_M = 40;        // 도착 판정 거리
const today = () => new Date().toLocaleDateString('sv');  // YYYY-MM-DD
const $ = s => document.querySelector(s);
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

// ---------- 상태 ----------
let S = load();
function load() {
  let s; try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
  s = s || {};
  s.stores ||= {}; s.log ||= []; s.speed ||= 20; s.radius ||= 2;
  if (!s.day || s.day.date !== today()) s.day = { date: today(), stock: {}, done: {} };
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function addLog(type, st, qty) {
  S.log.push({ t: Date.now(), type, id: st.id, name: st.name, qty: qty ?? null });
  save();
}

let me = null;            // {lat,lng}
let map, meOverlay, routeLine, overlays = {};
let route = [];           // 정렬된 store id
let lastCalcPos = null;

// ---------- 거리/경로 ----------
function hav(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const road = (a, b) => hav(a, b) * ROAD;
const mins = m => Math.max(1, Math.round(m / 1000 / S.speed * 60));
const fmtD = m => m < 1000 ? Math.round(m) + 'm' : (m/1000).toFixed(1) + 'km';

// 시작점에서 출발해 모든 점을 도는 최단 열린 경로 (Held-Karp, 많으면 근사)
function solve(start, pts) {
  const n = pts.length;
  if (n <= 1) return pts.map((_, i) => i);
  const d = (i, j) => road(pts[i], pts[j]), d0 = i => road(start, pts[i]);
  if (n <= 12) {
    const N = 1 << n, dp = new Float64Array(N * n).fill(Infinity), par = new Int8Array(N * n).fill(-1);
    for (let i = 0; i < n; i++) dp[(1 << i) * n + i] = d0(i);
    const D = []; for (let i = 0; i < n; i++) { D[i] = []; for (let j = 0; j < n; j++) D[i][j] = d(i, j); }
    for (let m = 1; m < N; m++) for (let i = 0; i < n; i++) {
      const v = dp[m * n + i]; if (!(m >> i & 1) || v === Infinity) continue;
      for (let j = 0; j < n; j++) if (!(m >> j & 1)) {
        const nm = m | 1 << j, nv = v + D[i][j];
        if (nv < dp[nm * n + j]) { dp[nm * n + j] = nv; par[nm * n + j] = i; }
      }
    }
    let best = 0; for (let i = 1; i < n; i++) if (dp[(N-1)*n+i] < dp[(N-1)*n+best]) best = i;
    const out = []; let m = N - 1, i = best;
    while (i !== -1) { out.push(i); const p = par[m * n + i]; m ^= 1 << i; i = p; }
    return out.reverse();
  }
  // 최근접 + 2-opt
  let left = pts.map((_, i) => i), cur = start, ord = [];
  while (left.length) { left.sort((a, b) => road(cur, pts[a]) - road(cur, pts[b])); const k = left.shift(); ord.push(k); cur = pts[k]; }
  const P = i => i < 0 ? start : pts[ord[i]];
  let imp = true;
  while (imp) { imp = false;
    for (let i = 0; i < n - 1; i++) for (let k = i + 1; k < n; k++) {
      const a = P(i-1), b = P(i), c = P(k), e = k + 1 < n ? P(k+1) : null;
      const before = road(a, b) + (e ? road(c, e) : 0), after = road(a, c) + (e ? road(b, e) : 0);
      if (after < before - 1) { ord = [...ord.slice(0, i), ...ord.slice(i, k+1).reverse(), ...ord.slice(k+1)]; imp = true; }
    }
  }
  return ord;
}

function targets() {
  return Object.values(S.stores).filter(s => S.day.stock[s.id] > 0 && !S.day.done[s.id]);
}
function recalc() {
  const ts = targets();
  const start = me || (map ? { lat: map.getCenter().lat(), lng: map.getCenter().lng() } : ts[0]);
  route = start ? solve(start, ts).map(i => ts[i].id) : [];
  lastCalcPos = me;
  renderRoute(); renderMarkers();
}

// ---------- 지도 ----------
function initMap() {
  const c = S.center || { lat: 37.3966, lng: 126.9630 };
  map = new naver.maps.Map('map', { center: new naver.maps.LatLng(c.lat, c.lng), zoom: 15, scaleControl: false, mapDataControl: false });
  naver.maps.Event.addListener(map, 'idle', () => {
    const p = map.getCenter(); S.center = { lat: p.lat(), lng: p.lng() }; save();
  });
  renderAll();
  startGps();
  if (!Object.keys(S.stores).length && window.kakao?.maps?.services) findStores();
}

function renderMarkers() {
  if (!map) return;
  Object.values(overlays).forEach(o => o.setMap(null)); overlays = {};
  for (const st of Object.values(S.stores)) {
    const q = S.day.stock[st.id], done = S.day.done[st.id];
    const idx = route.indexOf(st.id);
    let cls = 'pin', txt = 'GS';
    if (done === 'buy') { cls += ' done'; txt = '✔ 구매'; }
    else if (done === 'miss') { cls += ' miss'; txt = '✕ 허탕'; }
    else if (q > 0) { cls += ' has'; txt = (idx >= 0 ? (idx+1) + '. ' : '') + q + '개'; }
    else if (q === 0) { cls += ' zero'; txt = '0'; }
    const el = document.createElement('div'); el.className = cls; el.textContent = txt; el.title = st.name;
    el.onclick = () => { switchTab('check'); $('#q').value = ''; renderList(); document.getElementById('r-' + st.id)?.scrollIntoView({ block: 'center' }); flash(st.name); };
    const o = new naver.maps.Marker({ map, position: new naver.maps.LatLng(st.lat, st.lng), icon: { content: el, anchor: new naver.maps.Point(0, 0) }, zIndex: q > 0 ? 3 : 1, title: st.name });
    overlays[st.id] = o;
  }
  if (routeLine) routeLine.setMap(null);
  routeLine = null;
  const path = [...(me ? [me] : []), ...route.map(id => S.stores[id])].map(p => new naver.maps.LatLng(p.lat, p.lng));
  if (path.length > 1) {
    routeLine = new naver.maps.Polyline({ map, path, strokeWeight: 4, strokeColor: '#00b3d6', strokeOpacity: .85, strokeStyle: 'shortdash' });
  }
}

function findStores() {
  if (!map) return;
  if (!window.kakao?.maps?.services) return flash('매장 검색(카카오)을 불러오지 못했어요');
  const ps = new kakao.maps.services.Places();
  const nc = map.getCenter(), center = new kakao.maps.LatLng(nc.lat(), nc.lng());
  const radius = Math.min(20000, Math.round((+$('#radius').value || 2) * 1000));
  S.radius = radius / 1000;
  let found = 0;
  $('#findBtn').disabled = true; $('#findBtn').textContent = '찾는 중…';
  const cb = (data, status, pg) => {
    if (status === kakao.maps.services.Status.OK) {
      for (const p of data) {
        if (!/^GS25/i.test(p.place_name)) continue;
        if (!S.stores[p.id]) found++;
        S.stores[p.id] = { id: p.id, name: p.place_name.replace(/^GS25\s*/i, ''), addr: p.road_address_name || p.address_name, lat: +p.y, lng: +p.x };
      }
      if (pg.hasNextPage) return pg.nextPage();
    }
    save(); renderAll();
    $('#findBtn').disabled = false; $('#findBtn').textContent = '지도 중심 주변 GS25 찾기';
    flash(`GS25 ${Object.keys(S.stores).length}곳 (새로 찾음 ${found})`);
  };
  ps.keywordSearch('GS25', cb, { location: center, radius, sort: kakao.maps.services.SortBy.DISTANCE });
}

// ---------- GPS ----------
function startGps() {
  if (!navigator.geolocation) { $('#gps').textContent = '📍 GPS 없음 (지도 중심 사용)'; return; }
  let first = true;
  navigator.geolocation.watchPosition(p => {
    me = { lat: p.coords.latitude, lng: p.coords.longitude };
    $('#gps').textContent = `📍 GPS ±${Math.round(p.coords.accuracy)}m`;
    if (map) {
      const pos = new naver.maps.LatLng(me.lat, me.lng);
      if (!meOverlay) meOverlay = new naver.maps.Marker({ map, position: pos, icon: { content: '<div class="me"></div>', anchor: new naver.maps.Point(0, 0) }, zIndex: 9 });
      else meOverlay.setPosition(pos);
      if (first) { map.setCenter(pos); first = false; }
    }
    // 30m 이상 움직였을 때만 다시 계산
    if (!lastCalcPos || hav(lastCalcPos, me) > 30) recalc();
    else renderRoute();
  }, e => {
    $('#gps').textContent = '📍 위치 권한 꺼짐 (지도 중심 사용)';
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

// ---------- 화면: 재고 체크 ----------
function renderList() {
  const q = $('#q').value.trim();
  const ref = me || S.center;
  const list = Object.values(S.stores)
    .filter(s => !q || s.name.includes(q) || (s.addr || '').includes(q))
    .map(s => ({ ...s, dist: ref ? hav(ref, s) : 0 }))
    .sort((a, b) => a.dist - b.dist);
  if (!list.length) { $('#storeList').innerHTML = '<p class="muted">지도를 동네로 옮긴 뒤 "주변 GS25 찾기"를 누르세요.</p>'; return; }
  $('#storeList').innerHTML = list.map(s => {
    const v = S.day.stock[s.id], d = S.day.done[s.id];
    const cls = v > 0 ? 'has' : v === 0 ? 'zero' : '';
    return `<div class="row ${cls}" id="r-${s.id}">
      <div class="nm"><b>${esc(s.name)}${d === 'buy' ? ' ✔' : d === 'miss' ? ' ✕' : ''}</b><span>${fmtD(s.dist)} · ${esc(s.addr || '')}</span></div>
      <button class="btn sm" data-z="${s.id}">0</button>
      <input class="qty" inputmode="numeric" pattern="[0-9]*" data-q="${s.id}" value="${v ?? ''}" placeholder="?">
    </div>`;
  }).join('');
}
$('#storeList').addEventListener('change', e => {
  const id = e.target.dataset.q; if (!id) return;
  setStock(id, e.target.value);
});
$('#storeList').addEventListener('click', e => {
  const id = e.target.dataset.z; if (!id) return;
  setStock(id, '0');
});
function setStock(id, raw) {
  const st = S.stores[id];
  if (raw === '' || raw == null) delete S.day.stock[id];
  else {
    const n = Math.max(0, parseInt(raw, 10) || 0);
    S.day.stock[id] = n;
    addLog('stock', st, n);
  }
  save(); renderList(); recalc();
}
$('#q').addEventListener('input', renderList);
$('#findBtn').onclick = findStores;
$('#resetToday').onclick = () => {
  if (!confirm('오늘 입력한 재고와 방문 표시를 지울까요? (기록 탭의 로그는 남아요)')) return;
  S.day = { date: today(), stock: {}, done: {} }; save(); renderAll();
};

// ---------- 화면: 경로 ----------
function naverLink(st) {
  const from = me ? `slat=${me.lat}&slng=${me.lng}&sname=${encodeURIComponent('현위치')}&` : '';
  return `nmap://route/bicycle?${from}dlat=${st.lat}&dlng=${st.lng}&dname=${encodeURIComponent('GS25 ' + st.name)}&appname=htbang.github.io`;
}
function kakaoLink(stops) {
  const pts = [...(me ? [{ name: '현위치', ...me }] : []), ...stops.map(s => ({ name: 'GS25 ' + s.name, lat: s.lat, lng: s.lng }))];
  if (pts.length === 1) return `https://map.kakao.com/link/to/${encodeURIComponent(pts[0].name)},${pts[0].lat},${pts[0].lng}`;
  return 'https://map.kakao.com/link/by/bicycle/' + pts.slice(0, 7).map(p => `${encodeURIComponent(p.name.replace(/,/g, ' '))},${p.lat},${p.lng}`).join('/');
}
function renderRoute() {
  const stops = route.map(id => S.stores[id]).filter(Boolean);
  if (!stops.length) {
    $('#nextCard').innerHTML = `<div class="next"><h2>갈 곳이 없어요</h2><div class="meta">① 재고 체크 탭에서 재고가 있는 매장의 개수를 입력하세요.</div></div>`;
    $('#stops').innerHTML = ''; return;
  }
  const n = stops[0];
  const d0 = me ? road(me, n) : null;
  const arrived = me && hav(me, n) < ARRIVE_M;
  $('#nextCard').innerHTML = `<div class="next ${arrived ? 'arrived' : ''}">
    <div class="muted">${arrived ? '🎯 도착했어요!' : '다음 목적지'}</div>
    <h2>${esc(n.name)} <span style="color:var(--gs)">${S.day.stock[n.id]}개</span></h2>
    <div class="meta">${d0 != null ? `${fmtD(d0)} · 약 ${mins(d0)}분` : 'GPS 위치 없음'} · ${esc(n.addr || '')}</div>
    <div class="acts">
      ${isMobile ? `<a class="btn p" href="${naverLink(n)}">네이버맵 길안내</a>` : ''}
      <a class="btn ${isMobile ? '' : 'p'}" href="${kakaoLink([n])}" target="_blank">카카오맵</a>
      <button class="btn ok" data-buy="${n.id}">샀음</button>
      <button class="btn no" data-miss="${n.id}">허탕</button>
    </div></div>`;
  let cum = 0, prev = me;
  $('#stops').innerHTML = stops.map((s, i) => {
    const seg = prev ? road(prev, s) : 0; cum += seg; prev = s;
    return `<div class="stop"><div class="num">${i+1}</div>
      <div style="flex:1;min-width:0"><b>${esc(s.name)}</b> <span style="color:var(--gs);font-weight:700">${S.day.stock[s.id]}개</span>
      <div class="muted">+${fmtD(seg)} · 누적 ${fmtD(cum)} / ${mins(cum)}분</div></div>
      <button class="btn sm ok" data-buy="${s.id}">샀음</button><button class="btn sm no" data-miss="${s.id}">허탕</button></div>`;
  }).join('') + (() => {
    const fin = Object.entries(S.day.done);
    return fin.length ? `<h3>오늘 들른 곳</h3>` + fin.map(([id, r]) => `<div class="stop"><div class="num" style="background:${r === 'buy' ? 'var(--ok)' : 'var(--no)'}">${r === 'buy' ? '✔' : '✕'}</div><div style="flex:1">${esc(S.stores[id]?.name || id)}</div><button class="btn sm" data-undo="${id}">되돌리기</button></div>`).join('') : '';
  })();
}
document.addEventListener('click', e => {
  const t = e.target.dataset;
  if (t.buy) {
    const st = S.stores[t.buy];
    const q = prompt(`${st.name}\n몇 개 샀어요?`, '1'); if (q === null) return;
    S.day.done[st.id] = 'buy'; addLog('buy', st, Math.max(1, parseInt(q, 10) || 1));
    flash('구매 기록됨 ' + new Date().toLocaleTimeString('ko', { hour: '2-digit', minute: '2-digit' }));
    recalc(); renderList(); renderLog();
  } else if (t.miss) {
    const st = S.stores[t.miss];
    S.day.done[st.id] = 'miss'; addLog('miss', st, 0); recalc(); renderList(); renderLog();
  } else if (t.undo) {
    delete S.day.done[t.undo]; save(); recalc(); renderList();
  }
});
$('#kakaoAll').onclick = () => {
  const stops = route.map(id => S.stores[id]);
  if (!stops.length) return flash('재고 있는 매장이 없어요');
  if (stops.length > 6) flash('카카오 링크는 경유지 수가 제한돼서 앞쪽 6곳만 넣었어요');
  window.open(kakaoLink(stops), '_blank');
};
$('#speed').value = S.speed;
$('#speed').onchange = e => { S.speed = +e.target.value || 20; save(); renderRoute(); };
$('#radius').value = S.radius;

// ---------- 화면: 기록 ----------
const hm = t => new Date(t).toLocaleTimeString('ko', { hour: '2-digit', minute: '2-digit', hour12: false });
const dstr = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}(${'일월화수목금토'[d.getDay()]})`; };
function renderLog() {
  // 매장별: 재고 처음 본 시각(날짜별), 구매 횟수/총 개수
  const by = {};
  for (const l of S.log) {
    const b = by[l.id] ||= { name: l.name, days: {}, buys: 0, qty: 0, maxStock: 0 };
    if (l.type === 'stock' && l.qty > 0) {
      const day = new Date(l.t).toLocaleDateString('sv');
      if (!b.days[day] || l.t < b.days[day]) b.days[day] = l.t;
      b.maxStock = Math.max(b.maxStock, l.qty);
    }
    if (l.type === 'buy') { b.buys++; b.qty += l.qty || 0; }
  }
  const rows = Object.values(by).filter(b => Object.keys(b.days).length || b.buys)
    .sort((a, b) => (b.buys - a.buys) || (Object.keys(b.days).length - Object.keys(a.days).length));
  $('#stats').innerHTML = rows.length ? `<table><tr><th>매장</th><th>재고 본 날 (처음 본 시각)</th><th>구매</th></tr>${rows.map(b => {
    const ds = Object.entries(b.days).sort().slice(-5).map(([, t]) => `${dstr(t)} ${hm(t)}`).join('<br>');
    return `<tr><td><b>${esc(b.name)}</b><div class="muted">최대 ${b.maxStock}개</div></td><td>${ds || '-'}</td><td>${b.buys}회 / ${b.qty}개</td></tr>`;
  }).join('')}</table>` : '<p class="muted">아직 기록이 없어요.</p>';
  const buys = S.log.filter(l => l.type === 'buy').slice().reverse();
  $('#buys').innerHTML = buys.length ? `<table><tr><th>날짜</th><th>시각</th><th>매장</th><th>개수</th></tr>${buys.map(l => `<tr><td>${dstr(l.t)}</td><td><b>${hm(l.t)}</b></td><td>${esc(l.name)}</td><td>${l.qty}</td></tr>`).join('')}</table>` : '<p class="muted">아직 구매 기록이 없어요.</p>';
}
$('#exportBtn').onclick = async () => {
  const data = JSON.stringify({ stores: S.stores, log: S.log });
  try { await navigator.clipboard.writeText(data); flash('클립보드에 복사했어요'); }
  catch { prompt('아래 내용을 복사하세요', data); }
};
$('#importBtn').onclick = () => {
  const raw = prompt('복사한 기록을 붙여넣으세요'); if (!raw) return;
  try {
    const d = JSON.parse(raw);
    Object.assign(S.stores, d.stores || {});
    const seen = new Set(S.log.map(l => l.t + l.id + l.type));
    for (const l of d.log || []) if (!seen.has(l.t + l.id + l.type)) S.log.push(l);
    S.log.sort((a, b) => a.t - b.t); save(); renderAll(); flash('기록을 합쳤어요');
  } catch { alert('형식이 올바르지 않아요'); }
};

// ---------- 공통 ----------
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function flash(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(flash.h); flash.h = setTimeout(() => t.style.display = 'none', 2200); }
function switchTab(v) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  if (map) setTimeout(() => map.autoResize(), 50);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.v));
function renderAll() { renderList(); recalc(); renderLog(); }

// 날짜가 바뀌면 오늘 재고 초기화
setInterval(() => { if (S.day.date !== today()) { S.day = { date: today(), stock: {}, done: {} }; save(); renderAll(); } }, 60000);
// 화면 꺼짐 방지 (지원 기기만)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') navigator.wakeLock?.request('screen').catch(() => {}); });
navigator.wakeLock?.request('screen').catch(() => {});

window.kakao?.maps?.load(() => { if (map && !Object.keys(S.stores).length) findStores(); });
if (window.naver?.maps) initMap();
else { $('#map').innerHTML = '<p style="padding:20px">네이버 지도를 불러오지 못했어요.</p>'; renderAll(); }
</script>
</body>
</html>
